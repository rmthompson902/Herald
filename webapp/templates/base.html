<!--
Base template - shared shell for every page: nav, toast system, and the SocketIO
connection that receives live connection-health pushes from the background poller
in app/main.py (see docs/claude-plan.md's Frontend Architecture section).

Block areas for child templates: title, additional_css, content, scripts
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sitewide Audio Messaging{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', path='vendor/fonts/fonts.css') }}">
    <link href="{{ url_for('static', path='vendor/bootstrap/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='vendor/fontawesome/all.min.css') }}">

    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
    {% block additional_css %}{% endblock %}
</head>
<body class="app-theme">
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('schedules_list') }}">
                Sitewide Audio Messaging
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path.startswith('/schedules') %}active{% endif %}"
                           href="{{ url_for('schedules_list') }}">
                            <i class="fas fa-calendar-alt me-1"></i> Schedules
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path.startswith('/vog') %}active{% endif %}"
                           href="{{ url_for('vog_list') }}">
                            <i class="fas fa-bullhorn me-1"></i> VOG Messages
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path.startswith('/queues') %}active{% endif %}"
                           href="{{ url_for('queue_visualizer') }}">
                            <i class="fas fa-stream me-1"></i> Zone Queues
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path == '/settings' or request.url.path.startswith('/zones') %}active{% endif %}"
                           href="{{ url_for('settings_page') }}">
                            <i class="fas fa-cog me-1"></i> Settings
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        {% block content %}{% endblock %}
    </div>

    <footer class="footer py-3">
        <div class="container text-center">
            <span class="text-muted">Sitewide Audio Messaging &mdash; QLab scheduling layer</span>
        </div>
    </footer>

    <script src="{{ url_for('static', path='vendor/bootstrap/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', path='vendor/socketio/socket.io.min.js') }}"></script>

    <script>
        // Connects to the FastAPI app's own SocketIO relay - the browser never talks
        // to Node-RED directly (see Frontend Architecture in docs/claude-plan.md).
        const socket = io();

        socket.on('connect', () => {
            console.log('Connected to messaging server');
        });

        socket.on('disconnect', () => {
            console.log('Disconnected from server');
        });

        socket.on('error', (data) => {
            console.error('Socket error:', data.message);
            showToast('Connection Error', data.message, 'error');
        });

        // A play-now/schedule fire that reported "queued" earlier can go on to actually
        // play well after that response returned - this follow-up toast is how the
        // operator learns it did (or didn't get stuck). Page-agnostic since it can arrive
        // while the operator is anywhere in the app, not just the page that queued it.
        socket.on('queue_notification', (data) => {
            showToast('Queued Message Played', data.message, 'info');
        });

        // A fire that looked successful at request time (the operator saw "Playing") can
        // still turn out to have never actually produced audio - e.g. a cue whose Audio
        // Patch has no live output device attached. QLab doesn't deny the OSC start in that
        // case, so this can only be caught after the fact (see zoneQueueEngine.js's
        // suspected_playback_failure event) - this is that after-the-fact correction,
        // page-agnostic for the same reason queue_notification is.
        socket.on('playback_failure', (data) => {
            showToast('Possible Playback Failure', data.message, 'error');
        });

        /**
         * Global toast notification system, consistent across every page.
         * @param {string} title
         * @param {string} message
         * @param {string} type - 'success' | 'info' | 'warning' | 'error'
         */
        function showToast(title, message, type = 'info') {
            let toastContainer = document.querySelector('.toast-container');
            if (!toastContainer) {
                toastContainer = document.createElement('div');
                toastContainer.className = 'toast-container position-fixed bottom-0 end-0 p-3';
                document.body.appendChild(toastContainer);
            }

            const toastId = 'toast-' + Date.now();

            const typeConfig = {
                'success': { icon: 'fas fa-check-circle', iconColor: 'var(--success)' },
                'info': { icon: 'fas fa-info-circle', iconColor: 'var(--info)' },
                'warning': { icon: 'fas fa-exclamation-triangle', iconColor: 'var(--warning)' },
                'error': { icon: 'fas fa-times-circle', iconColor: 'var(--danger)' }
            };

            const config = typeConfig[type] || typeConfig['info'];

            const toastHtml = `
                <div id="${toastId}" class="toast app-toast" role="alert" aria-live="assertive" aria-atomic="true"
                     style="background-color: var(--bg-card) !important; border: 1px solid var(--border-color) !important; color: var(--text-primary) !important;">
                    <div class="toast-header" style="background-color: var(--bg-elevated) !important; border-bottom: 1px solid var(--border-color) !important; color: var(--text-primary) !important;">
                        <i class="${config.icon} me-2" style="color: ${config.iconColor};"></i>
                        <strong class="me-auto" style="color: var(--text-primary) !important;">${title}</strong>
                        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"
                                style="filter: invert(1) grayscale(100%) brightness(200%);"></button>
                    </div>
                    <div class="toast-body" style="color: var(--text-primary) !important;">${message}</div>
                </div>
            `;

            toastContainer.insertAdjacentHTML('beforeend', toastHtml);

            const toastElement = document.getElementById(toastId);
            const toast = new bootstrap.Toast(toastElement, {
                autohide: true,
                delay: type === 'error' ? 8000 : type === 'warning' ? 6000 : 5000
            });
            toast.show();

            toastElement.addEventListener('hidden.bs.toast', function() {
                toastElement.remove();
            });
        }

        window.showToast = showToast;
    </script>

    <script src="{{ url_for('static', path='js/utils/constants.js') }}"></script>
    <script src="{{ url_for('static', path='js/utils/time-format.js') }}"></script>
    <script src="{{ url_for('static', path='js/utils/button-state-manager.js') }}"></script>
    <script src="{{ url_for('static', path='js/utils/api-client.js') }}"></script>
    <script src="{{ url_for('static', path='js/utils/modal-manager.js') }}"></script>
    <script src="{{ url_for('static', path='js/utils/tooltip-manager.js') }}"></script>
    <script src="{{ url_for('static', path='js/utils/cue-picker.js') }}"></script>
    <script src="{{ url_for('static', path='js/utils/global-refresh.js') }}"></script>
    <script src="{{ url_for('static', path='js/utils/sortable-tables.js') }}"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
